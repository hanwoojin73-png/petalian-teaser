*,*::before,*::after{box-sizing:inherit;margin:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Josefin Sans","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-weight:300; -webkit-font-smoothing:antialiased;
  transition:background-color .9s ease, color .9s ease;
  display:flex; flex-direction:column; min-height:100%;
}
body[data-color="beige"]{--bg:var(--beige); --ink:#4A4F40; --ink-soft:rgba(74,79,64,.75)}
body[data-color="pink"]{--bg:var(--pink); --ink:#5B4A48; --ink-soft:rgba(91,74,72,.75)}
body[data-color="black"]{--bg:var(--black); --ink:#EDE9E1; --ink-soft:rgba(237,233,225,.68)}

main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:3rem 1.5rem 2rem; text-align:center}

.logo{
  width:min(62vw,280px); aspect-ratio:700/871;
  background-color:var(--ink);
  -webkit-mask:var(--logo) center/contain no-repeat; mask:var(--logo) center/contain no-repeat;
  transition:background-color .9s ease;
  animation:bloom 2.4s cubic-bezier(.22,.7,.2,1) both;
}
@keyframes bloom{
  from{clip-path:circle(0% at 50% 38%); opacity:0}
  30%{opacity:1}
  to{clip-path:circle(100% at 50% 38%); opacity:1}
}
.after{animation:rise 1.2s ease 1.9s both}
@keyframes rise{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

.line{margin-top:3rem; font-size:clamp(1.05rem,2.6vw,1.3rem); letter-spacing:.06em; line-height:1.6}
.line-ko{margin-top:.4rem; font-family:"Noto Sans KR",sans-serif; font-size:.92rem; color:var(--ink-soft); letter-spacing:.02em}

.colors{margin-top:2.75rem; display:flex; flex-direction:column; align-items:center; gap:.85rem}
.swatches{display:flex; gap:.9rem; padding:0; list-style:none}
.swatch{
  width:28px; height:28px; border-radius:50%; cursor:pointer;
  border:1px solid var(--ink-soft); padding:0; background:var(--c);
  outline-offset:4px; transition:transform .3s ease;
}
.swatch:hover{transform:scale(1.12)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--ink)}
.swatch:focus-visible{outline:2px solid var(--ink)}
.color-name{font-size:.85rem; letter-spacing:.08em; color:var(--ink-soft); min-height:1.3em}

footer{padding:1.5rem; text-align:center; font-size:.8rem; letter-spacing:.05em; color:var(--ink-soft);
  display:flex; flex-wrap:wrap; justify-content:center; gap:.5rem 1.75rem}
footer a{color:var(--ink); text-decoration:none; border-bottom:1px solid var(--ink-soft); padding-bottom:1px}
footer a:hover{border-color:var(--ink)}
footer a:focus-visible{outline:2px solid var(--ink); outline-offset:3px}

@media (prefers-reduced-motion:reduce){
  .logo,.after{animation:none}
  body,.logo,.swatch{transition:none}
}
</style>
</head>
<body data-color="sage">
<main>
  <h1 class="logo" role="img" aria-label="PETALIAN"></h1>

  <div class="after">
    <p class="line">Petal Visor arrives in 2027.</p>
    <p class="line-ko" lang="ko">페탈바이저, 2027년에 만나요.</p>

    <div class="colors">
      <ul class="swatches" aria-label="Petal Visor colors">
        <li><button class="swatch" style="--c:var(--sage)"  data-color="sage"  data-name="Sage Green" aria-label="Sage Green" aria-pressed="true"></button></li>
        <li><button class="swatch" style="--c:var(--beige)" data-color="beige" data-name="Warm Beige" aria-label="Warm Beige" aria-pressed="false"></button></li>
        <li><button class="swatch" style="--c:var(--pink)"  data-color="pink"  data-name="Soft Pink"  aria-label="Soft Pink"  aria-pressed="false"></button></li>
        <li><button class="swatch" style="--c:var(--black)" data-color="black" data-name="Black"      aria-label="Black"      aria-pressed="false"></button></li>
      </ul>
      <p class="color-name" aria-live="polite">Sage Green</p>
    </div>
  </div>
</main>

<footer class="after">
  <a href="mailto:creator@haniverse.co.kr">creator@haniverse.co.kr</a>
  <span>© 2026 HANiverse Co., Ltd.</span>
</footer>

<script>
const body=document.body, nameEl=document.querySelector('.color-name');
document.querySelectorAll('.swatch').forEach(btn=>{
  btn.addEventListener('click',()=>{
    body.dataset.color=btn.dataset.color;
    nameEl.textContent=btn.dataset.name;
    document.querySelectorAll('.swatch').forEach(b=>b.setAttribute('aria-pressed',b===btn));
  });
});
</script>
</body>
</html>
